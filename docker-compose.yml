name: samdu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-samdu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-samdu_secret}
      POSTGRES_DB: ${DB_NAME:-samdu}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-samdu}
      DB_PASSWORD: ${DB_PASSWORD:-samdu_secret}
      DB_NAME: ${DB_NAME:-samdu}
      DB_SYNC: ${DB_SYNC:-true}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@samdu.uz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-SamDU Administrator}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE_MB: 10
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_API_BASE_SERVER: http://backend:4000/api
      NUXT_PUBLIC_API_BASE: ${API_PUBLIC_URL:-http://localhost:4000}/api
      NUXT_PUBLIC_MEDIA_BASE: ${API_PUBLIC_URL:-http://localhost:4000}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_I18N_BASE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  uploads:
